# Production / SSH deploy stack (see .github/workflows/ci-cd.yml).
# API on :8081, MongoDB for auth, SQLite comics DB mounted from ./src/db.

services:
  comics_server:
    container_name: comics_server
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - go_server/local.env
    environment:
      HTTP_ADDRESS: 0.0.0.0
      HTTP_PORT: 8081
      HOST_URL: localhost:8081
      GRPC_ADDRESS: 0.0.0.0
      GRPC_PORT: 8082
      DB_ADDR: mongodb://mongodb:27017
      DB_NAME: comics
      COMICS_DB_DRIVER: sqlite
      COMICS_SQLITE_PATH: /data/comics.db
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-10m}
    ports:
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./src/db:/data
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - comics_net

  mongodb:
    image: mongo:7
    container_name: comics_mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - comics_net

  # Optional Postgres for experiments (not used by default Go SQLite path).
  postgres:
    profiles: ["postgres"]
    container_name: comics_postgres
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-comics}
      POSTGRES_PASSWORD: ${PGPASSWORD:-comics}
      POSTGRES_DB: ${PGDATABASE:-comics}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comics_net

networks:
  comics_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
