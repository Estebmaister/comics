services:
  comics_server:
    container_name: comics_server
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - ./local.env
    environment:
      - OTEL_EXPORTER_GRPC_ENDPOINT=host.docker.internal:4317
      - LOG_OUTPUT_FILE=.observability/log/docker_logs.log
      # 0.0.0.0 Needed to be available from host, outside the container
      - HTTP_ADDRESS=0.0.0.0
      - HTTP_PORT=8081
      - HOST_URL=localhost:8081
      - GRPC_ADDRESS=0.0.0.0
      - GRPC_PORT=8082
      - DB_ADDR=mongodb://mongodb:27017
      - DB_USER=
      - DB_PASS=
      - DB_NAME=comics
      - COMICS_SQLITE_PATH=/data/comics.db
    ports:
      - 8081:8081
      - 8082:8082
    volumes:
      - ../src/db:/data
      - ./.observability/log:/app/.observability/log
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure
    networks:
      - server_net

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - 27017:27017
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - server_net

networks:
  server_net:
    driver: bridge
